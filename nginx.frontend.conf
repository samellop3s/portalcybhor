server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Bloqueia arquivos sensíveis (mesmo com try_files do SPA).
  location ~* /(^|/)\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~* \.(?:env|ini|log|sql|bak|swp|git|htaccess|htpasswd)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~* /(backend|node_modules|\.git|docker-compose) {
    deny all;
    return 404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-XSS-Protection "0" always;

  # Encaminha a API e o WebSocket para o container da aplicação Node,
  # deixando frontend e backend na mesma origem (sem necessidade de CORS
  # em produção e permitindo cookies httpOnly "SameSite=Lax").
  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://api:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
  }
}
