<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dashboard de tarefas do Portal Cybhor Tech. Visualize estatísticas, gráficos e relatórios de produtividade.">
  <title>Dashboard - Tarefas</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container-fluid py-4">
    <div id="portal-shell"></div>

  <main class="mt-0">
    <div class="row g-3">
      <div class="col-lg-4">
        <div class="glass-panel p-3">
          <h6 class="mb-3">Resumo</h6>
          <ul class="list-unstyled mb-0">
            <li>Total de tarefas: <strong id="total-tasks">0</strong></li>
            <li>Concluídas (sucesso): <strong id="count-done">0</strong></li>
            <li>Falhas / Retrabalho: <strong id="count-failed">0</strong></li>
            <li>Pendentes/outros: <strong id="count-other">0</strong></li>
          </ul>
          <div class="mt-3">
            <canvas id="pieChart" height="200"></canvas>
          </div>
        </div>

        <div class="glass-panel p-3 mt-3">
          <h6 class="mb-3">Por integrante (Concluídas x Falhas)</h6>
          <canvas id="barChart" height="200"></canvas>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="glass-panel p-3">
          <h6 class="mb-3">Últimas tarefas alteradas</h6>
          <div class="table-responsive">
            <table class="table table-sm table-dark" id="tasks-table">
              <thead>
                <tr>
                  <th>Título</th>
                  <th>Assignee</th>
                  <th>Etapa</th>
                  <th>Concluído em</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-3">
            <button id="btn-export-csv" class="btn btn-cyber">Exportar CSV</button>
            <button id="btn-clear-filters" class="btn btn-cyber btn-cyber-purple">Limpar</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  </div>

  <!-- DOMPurify -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js" integrity="sha512-9+ilAOeXY8qy2bw/h51MmliNNHvdyhTpLIlqDmVpD26z8VjVJsUJtk5rhbDIUvYiD+EpGoAu0xTa7MhZohFQjA==" crossorigin="anonymous"></script>
  <!-- Bootstrap 5.3 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <!-- Socket.IO client (sincronização em tempo real) -->
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script type="module" src="assets/js/shared/mobile-menu.js"></script>
  <script type="module" src="assets/js/pages/dashboard.js"></script>
</body>
</html>
