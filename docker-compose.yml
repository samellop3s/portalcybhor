# ============================================
# Portal Cybhor Tech v2 - Orquestração Docker
# ============================================
# Sobe Postgres + MinIO (S3-compatible) + API + Frontend estático
# em uma única VPS. Configure os valores em um arquivo `.env` na
# raiz do projeto (veja `.env.example`) antes de rodar.
#
# Uso:
#   docker compose up -d --build
#   docker compose run --rm migrate   (aplica o schema no banco)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybhor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybhor_password}
      POSTGRES_DB: ${POSTGRES_DB:-cybhor_portal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybhor} -d ${POSTGRES_DB:-cybhor_portal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cybhor_net

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cybhor_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-troque_por_uma_senha_forte}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cybhor_net

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cybhor_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-troque_por_uma_senha_forte}
      S3_BUCKET: ${S3_BUCKET:-portalcybhor}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set download local/$$S3_BUCKET
      "
    networks:
      - cybhor_net

  migrate:
    build:
      context: ./backend
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cybhor}:${POSTGRES_PASSWORD:-cybhor_password}@postgres:5432/${POSTGRES_DB:-cybhor_portal}
      PGSSL: "false"
    command: ["node", "src/db/migrate.js"]
    networks:
      - cybhor_net

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cybhor}:${POSTGRES_PASSWORD:-cybhor_password}@postgres:5432/${POSTGRES_DB:-cybhor_portal}
      PGSSL: "false"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-portalcybhor}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-cybhor_minio_admin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-troque_por_uma_senha_forte}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    ports:
      - "4000:4000"
    networks:
      - cybhor_net

  web:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - cybhor_net

volumes:
  postgres_data:
  minio_data:

networks:
  cybhor_net:
    driver: bridge
