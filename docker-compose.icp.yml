# ============================================
# Portal Cybhor — Deploy na VPS iContainer
# ============================================
# Usa o PostgreSQL já criado no painel ICP e a rede
# icontainer-network. Frontend exposto em :8080 para
# o OpenResty do painel fazer proxy + SSL.
#
# Uso na VPS:
#   docker compose -f docker-compose.icp.yml up -d --build
#   docker compose -f docker-compose.icp.yml run --rm migrate

networks:
  icontainer-network:
    external: true

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - icontainer-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-portalcybhor}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET
      "
    networks:
      - icontainer-network

  migrate:
    build:
      context: ./backend
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PGSSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      S3_BUCKET: ${S3_BUCKET:-portalcybhor}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: ["node", "src/db/migrate.js"]
    networks:
      - icontainer-network

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      PGSSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-portalcybhor}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    networks:
      - icontainer-network

  web:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - icontainer-network

volumes:
  minio_data:
